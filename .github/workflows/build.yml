name: Build Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Analyze & Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Retry-safe Android NDK install
        shell: bash
        run: |
          set -u
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "::error::sdkmanager not found: $sdkmanager"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "NDK installation attempt $attempt of 3"
            if "$sdkmanager" --install "ndk;28.2.13676358"; then
              echo "NDK installation completed"
              exit 0
            fi
            echo "::warning::NDK install failed; clearing partial download before retry"
            rm -rf "$sdk/.downloadIntermediates" "$sdk/.temp" "$sdk/ndk/28.2.13676358"
            sleep 5
          done
          echo "::error::NDK installation failed after 3 attempts"
          exit 1
      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Patch legacy Tesseract Gradle repository
        run: |
          TESSERACT_GRADLE="$HOME/.pub-cache/hosted/pub.dev/flutter_tesseract_ocr-0.4.31/android/build.gradle"
          if [ -f "$TESSERACT_GRADLE" ]; then
            sed -i 's/jcenter()/mavenCentral()/g' "$TESSERACT_GRADLE"
          else
            echo "Tesseract Gradle file not found at expected path"
            exit 1
          fi

      - name: Flutter Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release AAB
        run: flutter build appbundle --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanFlow-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ScanFlow-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
